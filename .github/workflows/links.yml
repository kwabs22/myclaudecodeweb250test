name: Check external links

on:
  workflow_dispatch:
  # Runs after any merge that touches the docs or the checker, so every link change is checked
  push:
    branches: [main]
    paths:
      - "**.md"
      - "**.html"
      - site/check_external.py
      - .github/workflows/links.yml

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python site/check_external.py
