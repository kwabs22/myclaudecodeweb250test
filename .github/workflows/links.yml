name: Check external links

on:
  workflow_dispatch:
  # Changing the checker or this file also runs it, since the session cannot start workflows by hand
  push:
    branches: [main]
    paths:
      - site/check_external.py
      - .github/workflows/links.yml

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python site/check_external.py
