<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phase 2: Machine Learning Quiz - 1000 Questions</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-in {
            animation: fadeIn 0.3s ease-out;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .pulse {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-purple-50 via-blue-50 to-indigo-100 min-h-screen">
    <div id="app" class="container mx-auto p-6 max-w-5xl">
        <!-- Loading State -->
        <div id="loading" class="flex items-center justify-center h-screen">
            <div class="text-center">
                <div class="relative">
                    <div class="animate-spin rounded-full h-16 w-16 border-4 border-purple-200 border-t-purple-600 mx-auto"></div>
                    <div class="absolute inset-0 flex items-center justify-center">
                        <span class="text-2xl">🤖</span>
                    </div>
                </div>
                <p class="mt-6 text-xl font-semibold text-gray-700">Loading Phase 2...</p>
                <p class="mt-2 text-gray-600">Machine Learning Questions</p>
            </div>
        </div>

        <!-- Main Quiz Container -->
        <div id="quiz-container" class="hidden">
            <!-- Header -->
            <div class="bg-gradient-to-r from-purple-600 to-indigo-600 rounded-lg shadow-2xl p-8 mb-6 text-white fade-in">
                <div class="flex items-center justify-between mb-4">
                    <div>
                        <h1 class="text-4xl font-bold mb-2">
                            🧠 Phase 2: Machine Learning
                        </h1>
                        <p class="text-purple-100 text-lg">Master ML, Deep Learning & Prompt Engineering</p>
                    </div>
                    <div class="text-right">
                        <div class="text-3xl font-bold">1000</div>
                        <div class="text-sm text-purple-200">Questions</div>
                    </div>
                </div>

                <!-- Progress Bar -->
                <div class="mt-6">
                    <div class="flex justify-between text-sm text-purple-100 mb-2">
                        <span id="progress-text">Question 1 of 1000</span>
                        <span id="score-text">0/0 Correct (0%)</span>
                    </div>
                    <div class="w-full bg-purple-900 bg-opacity-30 rounded-full h-3">
                        <div id="progress-bar" class="bg-white h-3 rounded-full transition-all duration-300 shadow-lg" style="width: 0%"></div>
                    </div>
                </div>
            </div>

            <!-- Topic Navigation Tabs -->
            <div class="bg-white rounded-lg shadow-lg p-4 mb-6 fade-in">
                <div class="flex flex-wrap gap-2">
                    <button onclick="setTopicFilter('all')" class="topic-tab px-4 py-2 rounded-lg font-medium transition-all bg-purple-600 text-white">
                        All (1000)
                    </button>
                    <button onclick="setTopicFilter('classical_ml')" class="topic-tab px-4 py-2 rounded-lg font-medium transition-all bg-gray-100 text-gray-700 hover:bg-gray-200">
                        Classical ML (350)
                    </button>
                    <button onclick="setTopicFilter('deep_learning')" class="topic-tab px-4 py-2 rounded-lg font-medium transition-all bg-gray-100 text-gray-700 hover:bg-gray-200">
                        Deep Learning (500)
                    </button>
                    <button onclick="setTopicFilter('prompt_engineering')" class="topic-tab px-4 py-2 rounded-lg font-medium transition-all bg-gray-100 text-gray-700 hover:bg-gray-200">
                        Prompt Engineering (150)
                    </button>
                </div>
            </div>

            <!-- Filters & Stats -->
            <div class="bg-white rounded-lg shadow-lg p-4 mb-6 flex gap-4 flex-wrap items-center fade-in">
                <div class="flex items-center gap-2">
                    <svg class="w-5 h-5 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"></path>
                    </svg>
                    <span class="font-medium text-gray-700">Difficulty:</span>
                </div>

                <select id="difficulty-filter" class="px-4 py-2 border-2 border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent">
                    <option value="all">All Levels</option>
                    <option value="beginner">🟢 Beginner</option>
                    <option value="intermediate">🟡 Intermediate</option>
                    <option value="advanced">🔴 Advanced</option>
                </select>

                <button id="stats-button" class="ml-auto px-6 py-2 bg-gradient-to-r from-purple-600 to-indigo-600 text-white rounded-lg hover:from-purple-700 hover:to-indigo-700 transition-all shadow-md flex items-center gap-2 font-medium">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path>
                    </svg>
                    Your Stats
                </button>

                <button onclick="window.location.href='quiz-app.html'" class="px-6 py-2 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300 transition-all font-medium">
                    ← Phase 1
                </button>
            </div>

            <!-- Statistics Panel -->
            <div id="stats-panel" class="bg-white rounded-lg shadow-2xl p-8 mb-6 hidden fade-in">
                <h2 class="text-3xl font-bold text-gray-800 mb-6 flex items-center gap-3">
                    <span class="text-4xl">📊</span>
                    Your Performance
                </h2>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8" id="stats-summary"></div>
                <div id="stats-by-topic"></div>
            </div>

            <!-- Question Card -->
            <div id="question-card" class="bg-white rounded-lg shadow-2xl p-8 mb-6 fade-in">
                <!-- Question badges -->
                <div class="flex flex-wrap items-center gap-3 mb-6" id="question-badges"></div>

                <!-- Question text -->
                <h2 class="text-2xl font-semibold text-gray-800 mb-8 leading-relaxed" id="question-text"></h2>

                <!-- Options -->
                <div class="space-y-4 mb-6" id="options-container"></div>

                <!-- Explanation -->
                <div id="explanation" class="hidden"></div>
            </div>

            <!-- Navigation -->
            <div class="flex justify-between items-center bg-white rounded-lg shadow-lg p-6">
                <button id="prev-button" class="flex items-center gap-2 px-8 py-3 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300 disabled:opacity-50 disabled:cursor-not-allowed transition-all font-medium shadow-md">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                    </svg>
                    Previous
                </button>

                <div class="text-center">
                    <div class="text-2xl font-bold text-gray-800" id="nav-position">1 / 1000</div>
                    <div class="text-sm text-gray-500">Use ← → keys</div>
                </div>

                <button id="next-button" class="flex items-center gap-2 px-8 py-3 bg-gradient-to-r from-purple-600 to-indigo-600 text-white rounded-lg hover:from-purple-700 hover:to-indigo-700 disabled:opacity-50 disabled:cursor-not-allowed transition-all font-medium shadow-md">
                    Next
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        // State
        let allQuestions = [];
        let filteredQuestions = [];
        let currentIndex = 0;
        let userAnswers = {};
        let showingExplanation = false;
        let selectedAnswer = null;
        let currentTopicFilter = 'all';

        // Load questions
        fetch('phase2-question-bank.json')
            .then(res => res.json())
            .then(data => {
                allQuestions = data.questions;
                filteredQuestions = allQuestions;
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('quiz-container').classList.remove('hidden');
                renderQuestion();
                updateProgress();
            })
            .catch(err => {
                console.error('Error loading questions:', err);
                document.getElementById('loading').innerHTML = `
                    <div class="text-center">
                        <div class="text-6xl mb-4">⚠️</div>
                        <div class="text-2xl text-red-600 font-bold mb-2">Error Loading Questions</div>
                        <div class="text-gray-600">Please make sure phase2-question-bank.json is in the same directory</div>
                        <button onclick="location.reload()" class="mt-4 px-6 py-3 bg-purple-600 text-white rounded-lg hover:bg-purple-700">
                            Retry
                        </button>
                    </div>
                `;
            });

        // Set topic filter
        function setTopicFilter(topic) {
            currentTopicFilter = topic;
            // Update tab styles
            document.querySelectorAll('.topic-tab').forEach(tab => {
                tab.className = 'topic-tab px-4 py-2 rounded-lg font-medium transition-all bg-gray-100 text-gray-700 hover:bg-gray-200';
            });
            event.target.className = 'topic-tab px-4 py-2 rounded-lg font-medium transition-all bg-purple-600 text-white';
            filterQuestions();
        }

        // Filter questions
        function filterQuestions() {
            const difficulty = document.getElementById('difficulty-filter').value;

            filteredQuestions = allQuestions.filter(q => {
                const topicMatch = currentTopicFilter === 'all' || q.topic === currentTopicFilter;
                const difficultyMatch = difficulty === 'all' || q.difficulty === difficulty;
                return topicMatch && difficultyMatch;
            });

            currentIndex = 0;
            selectedAnswer = null;
            showingExplanation = false;
            renderQuestion();
            updateProgress();
        }

        // Render current question
        function renderQuestion() {
            const question = filteredQuestions[currentIndex];
            if (!question) return;

            // Badges
            const difficultyColors = {
                beginner: 'bg-green-100 text-green-700 border-green-300',
                intermediate: 'bg-yellow-100 text-yellow-700 border-yellow-300',
                advanced: 'bg-red-100 text-red-700 border-red-300'
            };

            const topicColors = {
                classical_ml: 'bg-blue-100 text-blue-700 border-blue-300',
                deep_learning: 'bg-purple-100 text-purple-700 border-purple-300',
                prompt_engineering: 'bg-indigo-100 text-indigo-700 border-indigo-300'
            };

            document.getElementById('question-badges').innerHTML = `
                <span class="px-4 py-2 rounded-lg text-sm font-semibold border-2 ${difficultyColors[question.difficulty]}">
                    ${question.difficulty === 'beginner' ? '🟢' : question.difficulty === 'intermediate' ? '🟡' : '🔴'} ${question.difficulty}
                </span>
                <span class="px-4 py-2 rounded-lg text-sm font-semibold border-2 ${topicColors[question.topic]}">
                    ${question.topic === 'classical_ml' ? '📊' : question.topic === 'deep_learning' ? '🧠' : '💬'} ${question.topic.replace(/_/g, ' ')}
                </span>
                <span class="px-4 py-2 bg-gray-100 text-gray-700 rounded-lg text-sm font-medium border-2 border-gray-300">
                    ${question.subtopic.replace(/_/g, ' ')}
                </span>
            `;

            // Question text
            document.getElementById('question-text').textContent = question.question;

            // Options
            const optionsHtml = question.options.map((option, index) => {
                const isSelected = selectedAnswer === index;
                const isCorrect = index === question.correct_answer;
                const showCorrect = showingExplanation && isCorrect;
                const showIncorrect = showingExplanation && isSelected && !isCorrect;

                let classes = 'w-full p-5 text-left rounded-xl border-2 transition-all font-medium ';
                if (showCorrect) classes += 'border-green-500 bg-green-50 shadow-lg';
                else if (showIncorrect) classes += 'border-red-500 bg-red-50 shadow-lg';
                else if (isSelected) classes += 'border-purple-500 bg-purple-50 shadow-md';
                else classes += 'border-gray-200 hover:border-purple-300 hover:bg-purple-50 hover:shadow-md cursor-pointer';

                if (showingExplanation) classes += ' cursor-not-allowed';

                return `
                    <button onclick="selectAnswer(${index})" class="${classes}" ${showingExplanation ? 'disabled' : ''}>
                        <div class="flex items-center justify-between">
                            <span>${option}</span>
                            ${showCorrect ? '<span class="text-2xl">✓</span>' : ''}
                            ${showIncorrect ? '<span class="text-2xl">✗</span>' : ''}
                        </div>
                    </button>
                `;
            }).join('');

            document.getElementById('options-container').innerHTML = optionsHtml;

            // Explanation
            const explanationDiv = document.getElementById('explanation');
            if (showingExplanation) {
                const isCorrect = selectedAnswer === question.correct_answer;
                explanationDiv.className = `p-6 rounded-xl mt-6 border-2 ${isCorrect ? 'bg-green-50 border-green-300' : 'bg-red-50 border-red-300'}`;
                explanationDiv.innerHTML = `
                    <h3 class="text-xl font-bold text-gray-800 mb-3 flex items-center gap-2">
                        <span class="text-3xl">${isCorrect ? '✅' : '❌'}</span>
                        ${isCorrect ? 'Correct!' : 'Incorrect'}
                    </h3>
                    <p class="text-gray-700 text-lg leading-relaxed">${question.explanation}</p>
                    ${question.hints && question.hints.length > 0 ? `
                        <div class="mt-4 pt-4 border-t ${isCorrect ? 'border-green-200' : 'border-red-200'}">
                            <p class="text-sm text-gray-600">
                                <span class="font-semibold">💡 Hint:</span> ${question.hints[0]}
                            </p>
                        </div>
                    ` : ''}
                `;
                explanationDiv.classList.remove('hidden');
            } else {
                explanationDiv.classList.add('hidden');
            }

            // Update navigation
            document.getElementById('prev-button').disabled = currentIndex === 0;
            document.getElementById('next-button').disabled = currentIndex === filteredQuestions.length - 1;
            document.getElementById('nav-position').textContent = `${currentIndex + 1} / ${filteredQuestions.length}`;
        }

        // Select answer
        function selectAnswer(answerIndex) {
            if (showingExplanation) return;

            selectedAnswer = answerIndex;
            showingExplanation = true;

            const question = filteredQuestions[currentIndex];
            userAnswers[question.id] = {
                selected: answerIndex,
                correct: answerIndex === question.correct_answer,
                question: question
            };

            renderQuestion();
            updateProgress();
        }

        // Navigation
        function nextQuestion() {
            if (currentIndex < filteredQuestions.length - 1) {
                currentIndex++;
                selectedAnswer = null;
                showingExplanation = false;
                renderQuestion();
                updateProgress();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                selectedAnswer = null;
                showingExplanation = false;
                renderQuestion();
                updateProgress();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        // Update progress
        function updateProgress() {
            const answeredQuestions = Object.values(userAnswers);
            const correct = answeredQuestions.filter(a => a.correct).length;
            const total = answeredQuestions.length;
            const percentage = total > 0 ? ((correct / total) * 100).toFixed(1) : 0;

            document.getElementById('progress-text').textContent = `Question ${currentIndex + 1} of ${filteredQuestions.length}`;
            document.getElementById('score-text').textContent = `${correct}/${total} Correct (${percentage}%)`;
            document.getElementById('progress-bar').style.width = `${((currentIndex + 1) / filteredQuestions.length) * 100}%`;
        }

        // Toggle statistics
        function toggleStats() {
            const statsPanel = document.getElementById('stats-panel');
            const isHidden = statsPanel.classList.contains('hidden');

            if (isHidden) {
                renderStats();
                statsPanel.classList.remove('hidden');
                window.scrollTo({ top: 0, behavior: 'smooth' });
            } else {
                statsPanel.classList.add('hidden');
            }
        }

        // Render statistics
        function renderStats() {
            const answeredQuestions = Object.values(userAnswers);
            const correct = answeredQuestions.filter(a => a.correct).length;
            const total = answeredQuestions.length;
            const percentage = total > 0 ? ((correct / total) * 100).toFixed(1) : 0;

            // Summary cards
            document.getElementById('stats-summary').innerHTML = `
                <div class="bg-gradient-to-br from-blue-50 to-blue-100 p-6 rounded-xl text-center border-2 border-blue-200 shadow-md">
                    <div class="text-5xl font-bold text-blue-600 mb-2">${correct}</div>
                    <div class="text-sm font-semibold text-blue-700">Correct Answers</div>
                </div>
                <div class="bg-gradient-to-br from-red-50 to-red-100 p-6 rounded-xl text-center border-2 border-red-200 shadow-md">
                    <div class="text-5xl font-bold text-red-600 mb-2">${total - correct}</div>
                    <div class="text-sm font-semibold text-red-700">Incorrect Answers</div>
                </div>
                <div class="bg-gradient-to-br from-green-50 to-green-100 p-6 rounded-xl text-center border-2 border-green-200 shadow-md">
                    <div class="text-5xl font-bold text-green-600 mb-2">${percentage}%</div>
                    <div class="text-sm font-semibold text-green-700">Accuracy</div>
                </div>
            `;

            // By topic
            const byTopic = {};
            answeredQuestions.forEach(answer => {
                const topic = answer.question.topic;
                if (!byTopic[topic]) {
                    byTopic[topic] = { correct: 0, total: 0 };
                }
                byTopic[topic].total++;
                if (answer.correct) byTopic[topic].correct++;
            });

            const topicIcons = {
                'classical_ml': '📊',
                'deep_learning': '🧠',
                'prompt_engineering': '💬'
            };

            const topicHtml = Object.entries(byTopic).map(([topic, data]) => {
                const topicPercentage = ((data.correct / data.total) * 100).toFixed(1);
                return `
                    <div class="flex items-center gap-4 p-4 bg-gray-50 rounded-lg">
                        <div class="text-3xl">${topicIcons[topic] || '📚'}</div>
                        <div class="flex-1">
                            <div class="font-semibold text-gray-700 capitalize mb-2">
                                ${topic.replace(/_/g, ' ')}
                            </div>
                            <div class="flex items-center gap-3">
                                <div class="flex-1 bg-gray-200 rounded-full h-3">
                                    <div class="bg-gradient-to-r from-purple-500 to-indigo-500 h-3 rounded-full transition-all" style="width: ${topicPercentage}%"></div>
                                </div>
                                <div class="text-sm font-bold text-gray-700 w-32">
                                    ${data.correct}/${data.total} (${topicPercentage}%)
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            document.getElementById('stats-by-topic').innerHTML = `
                <h3 class="text-2xl font-bold text-gray-800 mb-4">📈 Performance by Topic</h3>
                <div class="space-y-3">${topicHtml || '<p class="text-gray-500">Answer some questions to see your performance!</p>'}</div>
            `;
        }

        // Event listeners
        document.getElementById('difficulty-filter').addEventListener('change', filterQuestions);
        document.getElementById('stats-button').addEventListener('click', toggleStats);
        document.getElementById('prev-button').addEventListener('click', prevQuestion);
        document.getElementById('next-button').addEventListener('click', nextQuestion);

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') prevQuestion();
            if (e.key === 'ArrowRight') nextQuestion();
            if (e.key >= '1' && e.key <= '4' && !showingExplanation) {
                const optionIndex = parseInt(e.key) - 1;
                if (optionIndex < filteredQuestions[currentIndex].options.length) {
                    selectAnswer(optionIndex);
                }
            }
        });
    </script>
</body>
</html>
