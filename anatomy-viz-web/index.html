<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anatomy Visualization - Educational AR</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a2e;
            color: #eee;
            overflow: hidden;
        }

        #container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        #video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #video.flipped {
            transform: scaleX(-1);
        }

        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        #canvas.flipped {
            transform: scaleX(-1);
        }

        #header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            padding: 10px 15px;
            background: linear-gradient(180deg, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0) 100%);
            z-index: 10;
        }

        h1 {
            font-size: 20px;
            color: #4ecdc4;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }

        #debug-panel {
            position: absolute;
            top: 70px;
            left: 10px;
            background: rgba(0,0,0,0.9);
            padding: 15px;
            border-radius: 10px;
            font-size: 12px;
            z-index: 10;
            max-width: 300px;
            border: 2px solid #4ecdc4;
        }

        .debug-line {
            margin: 5px 0;
            padding: 5px;
            background: rgba(255,255,255,0.05);
            border-radius: 3px;
        }

        .debug-good { color: #4caf50; }
        .debug-warning { color: #ffa500; }
        .debug-error { color: #f44336; }
        .debug-info { color: #2196f3; }

        #controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.9);
            padding: 15px 20px;
            border-radius: 15px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            z-index: 10;
            max-width: 90vw;
        }

        #preview {
            position: absolute;
            bottom: 140px;
            right: 10px;
            width: 160px;
            height: 120px;
            border: 2px solid #4ecdc4;
            border-radius: 8px;
            z-index: 10;
            background: #000;
        }

        #preview canvas {
            width: 100%;
            height: 100%;
        }

        .btn {
            background: #4ecdc4;
            color: #1a1a2e;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            transition: all 0.3s;
        }

        .btn:hover {
            background: #45b7af;
            transform: translateY(-2px);
        }

        .btn.active {
            background: #ff6b6b;
            box-shadow: 0 0 15px rgba(255,107,107,0.5);
        }

        #fps-counter {
            position: absolute;
            top: 70px;
            right: 10px;
            background: rgba(0,0,0,0.9);
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            color: #4ecdc4;
            z-index: 10;
            border: 2px solid #4ecdc4;
        }

        .keypoint-dot {
            position: absolute;
            width: 8px;
            height: 8px;
            background: lime;
            border-radius: 50%;
            border: 1px solid white;
            transform: translate(-50%, -50%);
            z-index: 5;
        }

        .ar-item {
            position: absolute;
            font-size: 40px;
            transform: translate(-50%, -50%);
            z-index: 6;
            cursor: pointer;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            user-select: none;
            transition: transform 0.2s;
        }

        .ar-item:hover {
            transform: translate(-50%, -50%) scale(1.2);
        }

        #ar-controls {
            position: absolute;
            top: 70px;
            right: 180px;
            background: rgba(0,0,0,0.9);
            padding: 10px;
            border-radius: 10px;
            border: 2px solid #ff6b6b;
            z-index: 10;
            display: none;
        }

        #ar-controls.active {
            display: block;
        }

        .ar-item-btn {
            background: transparent;
            border: 2px solid #4ecdc4;
            color: #4ecdc4;
            font-size: 28px;
            padding: 8px 12px;
            margin: 3px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .ar-item-btn:hover, .ar-item-btn.selected {
            background: #4ecdc4;
            transform: scale(1.1);
        }

        @media (max-width: 768px) {
            #debug-panel {
                font-size: 10px;
                max-width: 200px;
            }
            h1 { font-size: 16px; }
            .btn { padding: 8px 12px; font-size: 11px; }
            #ar-controls {
                right: 10px;
                top: 200px;
            }
        }
    </style>
</head>
<body>
    <div id="container">
        <video id="video" autoplay playsinline></video>
        <canvas id="canvas"></canvas>

        <div id="header">
            <h1>🦴 Anatomy Visualization</h1>
        </div>

        <div id="debug-panel">
            <div style="font-weight: bold; margin-bottom: 10px; color: #4ecdc4;">📊 Debug Info</div>
            <div id="debug-content">
                <div class="debug-line debug-info">Starting...</div>
            </div>
        </div>

        <div id="fps-counter">FPS: 0</div>

        <div id="preview">
            <canvas id="preview-canvas"></canvas>
            <div style="position: absolute; bottom: 5px; left: 5px; font-size: 10px; background: rgba(0,0,0,0.8); padding: 3px 6px; border-radius: 3px;">
                AI sees this ⬆️
            </div>
        </div>

        <div id="ar-controls">
            <div style="font-weight: bold; margin-bottom: 8px; color: #ff6b6b; font-size: 12px;">
                📍 Pick item to place:
            </div>
            <div>
                <button class="ar-item-btn selected" onclick="selectARItem('🎯')">🎯</button>
                <button class="ar-item-btn" onclick="selectARItem('⭐')">⭐</button>
                <button class="ar-item-btn" onclick="selectARItem('❤️')">❤️</button>
            </div>
            <div>
                <button class="ar-item-btn" onclick="selectARItem('🔴')">🔴</button>
                <button class="ar-item-btn" onclick="selectARItem('🟢')">🟢</button>
                <button class="ar-item-btn" onclick="selectARItem('🔵')">🔵</button>
            </div>
            <div>
                <button class="ar-item-btn" onclick="selectARItem('💎')">💎</button>
                <button class="ar-item-btn" onclick="selectARItem('🎨')">🎨</button>
                <button class="ar-item-btn" onclick="selectARItem('🎪')">🎪</button>
            </div>
            <div style="margin-top: 8px;">
                <button class="btn" style="width: 100%; font-size: 11px;" onclick="clearARItems()">
                    🗑️ Clear All
                </button>
            </div>
        </div>

        <div id="controls">
            <button class="btn active" id="btn-debug" onclick="toggleDebug()">
                🐛 Debug
            </button>
            <button class="btn" id="btn-skeleton" onclick="toggleLayer('skeleton')">
                🦴 Skeleton
            </button>
            <button class="btn" id="btn-muscles" onclick="toggleLayer('muscles')">
                💪 Muscles
            </button>
            <button class="btn" id="btn-keypoints" onclick="toggleLayer('keypoints')">
                🎯 Keypoints
            </button>
            <button class="btn" id="btn-ar-place" onclick="toggleARPlacement()">
                📍 AR Place
            </button>
            <button class="btn active" id="btn-flip" onclick="toggleFlip()">
                🔄 Mirror
            </button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection"></script>

    <script>
        // Configuration
        const config = {
            video: { width: 640, height: 480 },
            layers: {
                skeleton: false,
                muscles: false,
                keypoints: false,
                debug: true
            },
            arPlacement: {
                enabled: false,
                selectedItem: '🎯',
                items: []
            },
            flipped: true  // Mirror mode on by default
        };

        // Global variables
        let video, canvas, ctx;
        let previewCanvas, previewCtx;
        let detector;
        let currentPose = null;
        let frameCount = 0;
        let fps = 0;
        let lastTime = Date.now();
        let detectionCount = 0;
        let processedFrame = null;

        // Debug messages
        const debugMessages = [];

        function addDebug(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            debugMessages.push({ time: timestamp, message, type });
            if (debugMessages.length > 10) debugMessages.shift();
            updateDebugPanel();
        }

        function updateDebugPanel() {
            if (!config.layers.debug) return;

            const panel = document.getElementById('debug-content');
            let html = '';

            debugMessages.forEach(msg => {
                html += `<div class="debug-line debug-${msg.type}">[${msg.time}] ${msg.message}</div>`;
            });

            // Add current stats
            html += `<div class="debug-line debug-info">━━━━━━━━━━━━━━━━</div>`;
            html += `<div class="debug-line debug-good">✓ Camera: Active</div>`;
            html += `<div class="debug-line ${currentPose ? 'debug-good' : 'debug-warning'}">
                ${currentPose ? '✓ Pose: Detected' : '⚠ Pose: Not Detected'}
            </div>`;
            html += `<div class="debug-line debug-info">Detections: ${detectionCount}</div>`;
            html += `<div class="debug-line debug-info">FPS: ${fps}</div>`;

            if (currentPose) {
                const highConf = currentPose.keypoints.filter(kp => kp.score > 0.5).length;
                const medConf = currentPose.keypoints.filter(kp => kp.score > 0.2).length;
                const allKp = currentPose.keypoints.length;
                html += `<div class="debug-line debug-info">Keypoints (high): ${highConf}/33</div>`;
                html += `<div class="debug-line debug-info">Keypoints (med): ${medConf}/33</div>`;

                // Show confidence scores
                const avgConf = currentPose.keypoints.reduce((sum, kp) => sum + kp.score, 0) / 33;
                html += `<div class="debug-line ${avgConf > 0.3 ? 'debug-good' : 'debug-warning'}">Avg confidence: ${avgConf.toFixed(3)}</div>`;

                // Show max confidence
                const maxConf = Math.max(...currentPose.keypoints.map(kp => kp.score));
                html += `<div class="debug-line debug-info">Max confidence: ${maxConf.toFixed(3)}</div>`;
            }

            panel.innerHTML = html;
        }

        // AR Placement functions
        function toggleFlip() {
            config.flipped = !config.flipped;
            video.classList.toggle('flipped');
            canvas.classList.toggle('flipped');
            document.getElementById('btn-flip').classList.toggle('active');
            addDebug(`Mirror mode ${config.flipped ? 'ON' : 'OFF'}`, 'info');
        }

        function toggleARPlacement() {
            config.arPlacement.enabled = !config.arPlacement.enabled;
            const btn = document.getElementById('btn-ar-place');
            btn.classList.toggle('active');

            const arControls = document.getElementById('ar-controls');
            arControls.classList.toggle('active');

            addDebug(`AR Placement ${config.arPlacement.enabled ? 'ON - Click to place items' : 'OFF'}`,
                config.arPlacement.enabled ? 'good' : 'info');
        }

        function selectARItem(item) {
            config.arPlacement.selectedItem = item;

            // Update button selection
            document.querySelectorAll('.ar-item-btn').forEach(btn => {
                btn.classList.remove('selected');
                if (btn.textContent === item) {
                    btn.classList.add('selected');
                }
            });

            addDebug(`Selected ${item} for placement`, 'info');
        }

        function clearARItems() {
            config.arPlacement.items = [];
            document.querySelectorAll('.ar-item').forEach(el => el.remove());
            addDebug('Cleared all AR items', 'info');
        }

        function placeARItem(x, y) {
            if (!config.arPlacement.enabled) return;

            const item = {
                emoji: config.arPlacement.selectedItem,
                x: x,
                y: y,
                id: Date.now()
            };

            config.arPlacement.items.push(item);

            // Create DOM element
            const div = document.createElement('div');
            div.className = 'ar-item';
            div.textContent = item.emoji;
            div.style.left = x + 'px';
            div.style.top = y + 'px';
            div.dataset.id = item.id;

            // Double click to remove
            div.addEventListener('dblclick', (e) => {
                e.stopPropagation();
                config.arPlacement.items = config.arPlacement.items.filter(i => i.id !== item.id);
                div.remove();
                addDebug(`Removed AR item`, 'info');
            });

            document.getElementById('container').appendChild(div);
            addDebug(`Placed ${item.emoji} at (${Math.round(x)}, ${Math.round(y)})`, 'good');
        }

        // Initialize
        async function init() {
            try {
                addDebug('🚀 Initializing app...', 'info');

                // Setup video
                video = document.getElementById('video');
                addDebug('📹 Requesting camera...', 'info');

                // Apply initial flip state
                if (config.flipped) {
                    video.classList.add('flipped');
                    canvas = document.getElementById('canvas');
                    canvas.classList.add('flipped');
                }

                // Request HIGHEST quality camera
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        width: { ideal: 1920, min: 640 },
                        height: { ideal: 1080, min: 480 },
                        facingMode: 'user',
                        frameRate: { ideal: 30, min: 15 },
                        aspectRatio: { ideal: 16/9 }
                    }
                });

                video.srcObject = stream;
                addDebug('✓ Camera access granted', 'good');

                // Setup canvas
                if (!canvas) canvas = document.getElementById('canvas');
                ctx = canvas.getContext('2d');

                // Setup preview canvas
                previewCanvas = document.getElementById('preview-canvas');
                previewCtx = previewCanvas.getContext('2d');

                // Add click handler for AR placement
                canvas.addEventListener('click', (e) => {
                    const rect = canvas.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;
                    placeARItem(e.clientX, e.clientY);  // Use screen coordinates
                });

                await new Promise(resolve => {
                    video.onloadedmetadata = () => {
                        canvas.width = video.videoWidth;
                        canvas.height = video.videoHeight;

                        // Preview canvas shows what AI processes
                        previewCanvas.width = 640;
                        previewCanvas.height = 480;

                        addDebug(`✓ Camera: ${video.videoWidth}x${video.videoHeight}`, 'good');
                        addDebug(`✓ AI processes: 640x480`, 'info');
                        resolve();
                    };
                });

                addDebug('🧠 Loading AI model...', 'info');

                // Load pose model
                const model = poseDetection.SupportedModels.BlazePose;
                detector = await poseDetection.createDetector(model, {
                    runtime: 'tfjs',
                    modelType: 'lite'
                });

                addDebug('✓ AI model loaded', 'good');
                addDebug('👤 Stand in frame!', 'warning');

                // Start detection
                detectPose();

            } catch (error) {
                addDebug(`❌ Error: ${error.message}`, 'error');
                console.error('Init error:', error);
            }
        }

        // Preprocess frame for better detection
        function preprocessFrame() {
            // Create a processed version at 640x480
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = 640;
            tempCanvas.height = 480;
            const tempCtx = tempCanvas.getContext('2d');

            // Draw scaled video
            tempCtx.drawImage(video, 0, 0, 640, 480);

            // Get image data
            const imageData = tempCtx.getImageData(0, 0, 640, 480);
            const data = imageData.data;

            // Enhance contrast and sharpness
            for (let i = 0; i < data.length; i += 4) {
                // Increase contrast
                const factor = 1.3;
                data[i] = Math.min(255, ((data[i] - 128) * factor) + 128);     // R
                data[i+1] = Math.min(255, ((data[i+1] - 128) * factor) + 128); // G
                data[i+2] = Math.min(255, ((data[i+2] - 128) * factor) + 128); // B
            }

            tempCtx.putImageData(imageData, 0, 0);

            // Show in preview what AI sees
            previewCtx.drawImage(tempCanvas, 0, 0);

            return tempCanvas;
        }

        // Main detection loop
        async function detectPose() {
            try {
                // Calculate FPS
                frameCount++;
                const now = Date.now();
                if (now - lastTime > 1000) {
                    fps = frameCount;
                    frameCount = 0;
                    lastTime = now;
                    document.getElementById('fps-counter').textContent = `FPS: ${fps}`;
                }

                // Preprocess frame for better detection
                processedFrame = preprocessFrame();

                // Detect poses on PROCESSED frame
                const poses = await detector.estimatePoses(processedFrame);

                // Clear canvas
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                if (poses.length > 0) {
                    currentPose = poses[0];
                    detectionCount++;

                    // Scale keypoints from 640x480 to actual canvas size
                    const scaleX = canvas.width / 640;
                    const scaleY = canvas.height / 480;

                    const scaledKeypoints = currentPose.keypoints.map(kp => ({
                        ...kp,
                        x: kp.x * scaleX,
                        y: kp.y * scaleY
                    }));

                    // Draw layers with scaled keypoints
                    if (config.layers.keypoints) {
                        drawKeypoints(scaledKeypoints);
                    }

                    if (config.layers.skeleton) {
                        drawSkeleton(scaledKeypoints);
                    }

                    if (config.layers.muscles) {
                        drawMuscles(scaledKeypoints);
                    }

                    // Update debug every 30 frames
                    if (detectionCount % 30 === 0) {
                        const goodKeypoints = currentPose.keypoints.filter(kp => kp.score > 0.2).length;
                        const avgConf = currentPose.keypoints.reduce((sum, kp) => sum + kp.score, 0) / 33;

                        if (goodKeypoints < 10) {
                            addDebug(`⚠ Only ${goodKeypoints} keypoints - adjust lighting/distance`, 'warning');
                        } else if (avgConf < 0.3) {
                            addDebug(`⚠ Low confidence (${avgConf.toFixed(2)}) - move back from camera`, 'warning');
                        } else {
                            addDebug(`✓ Good detection! Turn on layers to see AR`, 'good');
                        }
                    }
                } else {
                    currentPose = null;
                    if (detectionCount > 30 && detectionCount % 60 === 0) {
                        addDebug('⚠ No pose detected - move into frame', 'warning');
                    }
                }

                updateDebugPanel();

                // Continue loop
                requestAnimationFrame(detectPose);

            } catch (error) {
                addDebug(`❌ Detection error: ${error.message}`, 'error');
                console.error('Detection error:', error);
            }
        }

        // Draw keypoints
        function drawKeypoints(keypoints) {
            keypoints.forEach((kp, idx) => {
                // SHOW ALL KEYPOINTS regardless of confidence!
                // Color based on confidence
                let color = 'red';  // Low confidence
                if (kp.score > 0.5) color = 'lime';  // High confidence
                else if (kp.score > 0.2) color = 'yellow';  // Medium confidence

                // Draw circle
                ctx.beginPath();
                ctx.arc(kp.x, kp.y, 8, 0, 2 * Math.PI);
                ctx.fillStyle = color;
                ctx.fill();
                ctx.strokeStyle = 'white';
                ctx.lineWidth = 2;
                ctx.stroke();

                // Draw label with confidence score
                ctx.fillStyle = 'white';
                ctx.font = 'bold 11px Arial';
                ctx.strokeStyle = 'black';
                ctx.lineWidth = 3;
                ctx.strokeText(`${idx}:${kp.score.toFixed(2)}`, kp.x + 10, kp.y - 10);
                ctx.fillText(`${idx}:${kp.score.toFixed(2)}`, kp.x + 10, kp.y - 10);
            });
        }

        // Draw skeleton
        function drawSkeleton(keypoints) {
            const connections = [
                // Spine
                [0, 1], [1, 2], [2, 3], [3, 7],
                // Left arm
                [11, 13], [13, 15],
                // Right arm
                [12, 14], [14, 16],
                // Torso
                [11, 12], [11, 23], [12, 24], [23, 24],
                // Left leg
                [23, 25], [25, 27],
                // Right leg
                [24, 26], [26, 28]
            ];

            connections.forEach(([i, j]) => {
                const kp1 = keypoints[i];
                const kp2 = keypoints[j];

                // LOWER threshold to 0.1 for mobile
                if (kp1.score > 0.1 && kp2.score > 0.1) {
                    // Draw bone
                    ctx.beginPath();
                    ctx.moveTo(kp1.x, kp1.y);
                    ctx.lineTo(kp2.x, kp2.y);
                    ctx.strokeStyle = '#F5F5DC';
                    ctx.lineWidth = 10;
                    ctx.lineCap = 'round';
                    ctx.stroke();

                    // Draw joints
                    [kp1, kp2].forEach(kp => {
                        ctx.beginPath();
                        ctx.arc(kp.x, kp.y, 6, 0, 2 * Math.PI);
                        ctx.fillStyle = '#DDD';
                        ctx.fill();
                        ctx.strokeStyle = '#888';
                        ctx.lineWidth = 2;
                        ctx.stroke();
                    });
                }
            });
        }

        // Draw muscles
        function drawMuscles(keypoints) {
            // Biceps (left)
            drawMuscle(keypoints, [11, 13, 15], 100, 'rgba(255,100,100,0.6)');
            // Biceps (right)
            drawMuscle(keypoints, [12, 14, 16], 100, 'rgba(255,100,100,0.6)');
            // Quads (left)
            drawMuscle(keypoints, [23, 25, 27], 160, 'rgba(100,255,100,0.6)', true);
            // Quads (right)
            drawMuscle(keypoints, [24, 26, 28], 160, 'rgba(100,255,100,0.6)', true);
        }

        function drawMuscle(keypoints, indices, threshold, color, reverse = false) {
            const [i1, i2, i3] = indices;
            const kp1 = keypoints[i1];
            const kp2 = keypoints[i2];
            const kp3 = keypoints[i3];

            // LOWER threshold to 0.1 for mobile
            if (kp1.score > 0.1 && kp2.score > 0.1 && kp3.score > 0.1) {
                const angle = calculateAngle(kp1, kp2, kp3);
                let isActive = reverse ? angle > threshold : angle < threshold;

                const finalColor = isActive ? color.replace('100', '255') : color;

                // Draw muscle shape
                const dx = kp3.x - kp1.x;
                const dy = kp3.y - kp1.y;
                const perpX = -dy * 0.08;
                const perpY = dx * 0.08;

                ctx.beginPath();
                ctx.moveTo(kp1.x + perpX, kp1.y + perpY);
                ctx.lineTo(kp2.x + perpX, kp2.y + perpY);
                ctx.lineTo(kp3.x + perpX, kp3.y + perpY);
                ctx.lineTo(kp3.x - perpX, kp3.y - perpY);
                ctx.lineTo(kp2.x - perpX, kp2.y - perpY);
                ctx.lineTo(kp1.x - perpX, kp1.y - perpY);
                ctx.closePath();
                ctx.fillStyle = finalColor;
                ctx.fill();

                if (isActive) {
                    ctx.strokeStyle = 'rgba(255,255,0,0.8)';
                    ctx.lineWidth = 3;
                    ctx.stroke();
                }
            }
        }

        function calculateAngle(p1, p2, p3) {
            const radians = Math.atan2(p3.y - p2.y, p3.x - p2.x) -
                          Math.atan2(p1.y - p2.y, p1.x - p2.x);
            let angle = Math.abs(radians * 180.0 / Math.PI);
            if (angle > 180.0) angle = 360.0 - angle;
            return angle;
        }

        // Toggle functions
        function toggleLayer(layer) {
            config.layers[layer] = !config.layers[layer];
            const btn = document.getElementById(`btn-${layer}`);
            btn.classList.toggle('active');
            addDebug(`${layer} ${config.layers[layer] ? 'ON' : 'OFF'}`, 'info');
        }

        function toggleDebug() {
            config.layers.debug = !config.layers.debug;
            document.getElementById('debug-panel').style.display =
                config.layers.debug ? 'block' : 'none';
            document.getElementById('btn-debug').classList.toggle('active');
        }

        // Start
        window.addEventListener('load', init);
    </script>
</body>
</html>
